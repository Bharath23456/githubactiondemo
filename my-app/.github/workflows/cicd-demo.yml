name: GitHub Actions CI/CD Demo

# 1. Triggers: When should this script run?
on:
  push:
    branches: [ "main" ] # Runs when code is pushed to the main branch
  pull_request:
    branches: [ "main" ] # Runs when someone opens a pull request to main
  workflow_dispatch:     # Allows you to click a button and run it manually

# 2. Jobs: The actual automation blocks
jobs:

  # --- THE CI PHASE (Continuous Integration) ---
  build-and-test:
    runs-on: ubuntu-latest # The operating system of the virtual runner

    steps:
      # Pull the repository code into the virtual runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Node.js on the runner environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pull project dependencies cleanly
      - name: Install Dependencies
        run: npm ci

      # Execute your automated unit/integration tests
      - name: Run Unit Tests
        run: npm test

  # --- THE CD PHASE (Continuous Delivery) ---
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-test # CRITICAL: Only run this job if the testing job passes successfully!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mocking a deployment phase (e.g., to AWS, Heroku, or Azure)
      - name: Deploying Application
        run: |
          echo "Connecting to the production environment..."
          echo "Deploying the latest build from the main branch..."
          echo "Deployment successful! 🎉"
